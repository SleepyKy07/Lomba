<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lintas Lomba — Tournament Simulator</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">Tournament Simulator</a>
    <nav class="topnav">
      <a href="index.html">Beranda</a>
      <a href="kelas.html">Master Kelas</a>
      <a href="lomba.html">Lomba</a>
      <a href="banding.html">Banding</a>
      <a href="lintas.html">Lintas</a>
      <a href="login.html">Masuk</a>
    </nav>
    <span id="auth-slot"></span>
  </header>
  <main>
    <h1 class="page-title">Lintas lomba &amp; optimasi</h1>
    <div id="cfg-banner" class="phase-banner" hidden>
      Supabase belum dikonfigurasi. Isi <code>docs/js/config.js</code>.
    </div>
    <div id="flash" class="flash" hidden></div>
    <div id="err" class="err" hidden></div>
    <div id="login-cta" class="phase-banner" hidden></div>
    <div id="engine-status" class="phase-banner" hidden></div>

    <div class="card">
      <h2>Pilih lomba (≥2)</h2>
      <div class="checks" id="pilih-box"><span class="empty">Memuat…</span></div>
      <div class="form-grid" style="margin-top:.75rem">
        <label>Max shift batch <input id="opt-max" type="number" value="12" min="0"></label>
      </div>
      <div class="actions">
        <button type="button" id="btn-lintas">Deteksi bentrok</button>
        <button type="button" id="btn-optimasi" class="ghost">Optimasi multi-lomba</button>
      </div>
    </div>

    <div class="card" id="hasil-lintas" hidden>
      <h2>Temuan lintas lomba</h2>
      <div id="out-lintas"></div>
      <h3>Total player-load</h3>
      <pre id="out-load"></pre>
    </div>

    <div class="card" id="hasil-opt" hidden>
      <h2>Hasil optimasi (time-shift)</h2>
      <div id="out-opt-notes"></div>
      <div id="out-opt-left"></div>
      <pre id="out-opt-summ"></pre>
    </div>
  </main>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/pyengine.js"></script>
  <script src="js/main.js"></script>
  <script src="js/page.js"></script>
  <script src="js/lintas.js"></script>
</body>
</html>
