<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Master Kelas — Tournament Simulator</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">Tournament Simulator</a>
    <nav class="topnav">
      <a href="index.html">Beranda</a>
      <a href="kelas.html">Master Kelas</a>
      <a href="lomba.html">Lomba</a>
      <a href="banding.html">Banding</a>
      <a href="lintas.html">Lintas</a>
    </nav>
    <span id="auth-slot"></span>
  </header>
  <main>
    <h1 class="page-title">Master Kelas (<span id="kelas-count">0</span>)</h1>
    <div id="cfg-banner" class="phase-banner" hidden>
      Supabase belum dikonfigurasi. Isi <code>docs/js/config.js</code>
      (Project URL + <strong>anon public</strong> key) lalu muat ulang.
      Jangan pernah pakai service_role key di frontend.
    </div>
    <div id="flash" class="flash" hidden></div>
    <div id="err" class="err" hidden></div>
    <div id="login-cta" class="phase-banner" hidden></div>

    <div class="card">
      <h2>Daftar kelas</h2>
      <table id="kelas-table">
        <thead>
          <tr><th>ID</th><th>Nama</th><th>Tingkat</th><th></th></tr>
        </thead>
        <tbody>
          <tr><td colspan="4" class="empty">Memuat…</td></tr>
        </tbody>
      </table>
    </div>

    <div class="card" id="mutate-card" hidden>
      <h2>Tambah kelas</h2>
      <form id="form-tambah" autocomplete="off">
        <div class="form-grid">
          <label>ID <input id="fld-id" name="id" required placeholder="XII-01"></label>
          <label>Nama <input id="fld-nama" name="nama" placeholder="Kelas A"></label>
          <label>Tingkat <input id="fld-tingkat" name="tingkat" value="XII"></label>
        </div>
        <div class="actions"><button type="submit">Tambah</button></div>
      </form>
    </div>
  </main>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script src="js/kelas.js"></script>
</body>
</html>
